[tools]
java = "21"

[tasks.doctor]
description = "Check prerequisites (detect only - never installs anything)"
run = '''
java -version
sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$(grep '^sdk\.dir=' local.properties 2>/dev/null | head -n1 | cut -d= -f2-)}}"
if [ -n "$sdk" ] && [ -d "$sdk" ]; then
  echo "Android SDK: $sdk"
else
  echo "Android SDK: not found (will be provisioned by mise on build/setup)"
fi
'''
run_windows = '''
#!/usr/bin/env -S powershell -NoProfile
$ErrorActionPreference = 'Stop'
java -version
$sdk = $env:ANDROID_HOME
if (-not $sdk) { $sdk = $env:ANDROID_SDK_ROOT }
if (Test-Path local.properties) {
  $line = Select-String -Path local.properties -SimpleMatch 'sdk.dir=' | Select-Object -First 1
  if ($line) { $sdk = $line.Line.Substring($line.Line.IndexOf('=') + 1).Replace('\\', '\').Replace('\:', ':') }
}
if ($sdk -and (Test-Path $sdk)) {
  Write-Host "Android SDK: $sdk"
} else {
  Write-Host 'Android SDK: not found (will be provisioned by mise on build/setup)'
}
'''

[tasks.setup]
description = "Use system Android SDK if present; otherwise install cmdline-tools via mise and configure local.properties"
run = '''
sdk="$(grep '^sdk\.dir=' local.properties 2>/dev/null | head -n1 | cut -d= -f2-)"
sdk="${sdk:-${ANDROID_HOME:-$ANDROID_SDK_ROOT}}"
if [ -n "$sdk" ] && [ -d "$sdk" ]; then
  echo "Using existing Android SDK: $sdk"
  exit 0
fi
mise install android-sdk@23.0
sdk="$(mise where android-sdk@23.0)"
yes | mise exec android-sdk@23.0 -- sdkmanager --sdk_root="$sdk" --licenses >/dev/null
printf 'sdk.dir=%s\n' "$sdk" > local.properties
echo "Provisioned Android SDK: $sdk"
'''
run_windows = '''
#!/usr/bin/env -S powershell -NoProfile
$ErrorActionPreference = 'Stop'
$sdk = $null
if (Test-Path local.properties) {
  $line = Select-String -Path local.properties -SimpleMatch 'sdk.dir=' | Select-Object -First 1
  if ($line) { $sdk = $line.Line.Substring($line.Line.IndexOf('=') + 1).Replace('\\', '\').Replace('\:', ':') }
}
if (-not $sdk) { $sdk = $env:ANDROID_HOME }
if (-not $sdk) { $sdk = $env:ANDROID_SDK_ROOT }
if ($sdk -and (Test-Path $sdk)) {
  Write-Host "Using existing Android SDK: $sdk"
  exit 0
}
mise install android-sdk@23.0
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
$sdk = (mise where android-sdk@23.0).Trim()
1..20 | ForEach-Object { 'y' } | mise exec android-sdk@23.0 -- sdkmanager --sdk_root=$sdk --licenses | Out-Null
$escaped = $sdk.Replace('\', '\\').Replace(':', '\:')
Set-Content -Path local.properties -Value "sdk.dir=$escaped"
Write-Host "Provisioned Android SDK: $sdk"
'''

[tasks.build]
description = "Build the debug APK"
depends = ["setup"]
run = "./gradlew assembleDebug"
run_windows = ".\\gradlew.bat assembleDebug"

[tasks.test]
description = "Run unit tests"
depends = ["setup"]
run = "./gradlew test"
run_windows = ".\\gradlew.bat test"

[tasks.lint]
description = "Run Android lint"
depends = ["setup"]
run = "./gradlew lint"
run_windows = ".\\gradlew.bat lint"

[tasks.format]
description = "Auto-format Kotlin with ktlint"
run = "./gradlew ktlintFormat"
run_windows = ".\\gradlew.bat ktlintFormat"

[tasks.lint-kotlin]
description = "Check Kotlin style with ktlint"
run = "./gradlew ktlintCheck"
run_windows = ".\\gradlew.bat ktlintCheck"

[tasks.check]
description = "Build, lint and unit test (same as CI's first job)"
depends = ["setup"]
run = "./gradlew build lint test"
run_windows = ".\\gradlew.bat build lint test"

[tasks.clean]
description = "Remove build outputs"
run = "./gradlew clean"
run_windows = ".\\gradlew.bat clean"

[tasks.launch]
description = "Install the debug build on the connected device and launch it"
depends = ["setup"]
run = "./gradlew installDebug && adb shell monkey -p io.github.kitswas.virtualgamepadmobile -c android.intent.category.LAUNCHER 1"
run_windows = ".\\gradlew.bat installDebug && adb shell monkey -p io.github.kitswas.virtualgamepadmobile -c android.intent.category.LAUNCHER 1"

[tasks.connected-test]
description = "Run instrumented tests on a connected device or emulator (log in out.log)"
depends = ["setup"]
run = "./gradlew connectedAndroidTest 2>&1 | tee out.log"
run_windows = "powershell -NoProfile -Command \".\\gradlew.bat connectedAndroidTest 2>&1 | Tee-Object out.log\""

[tasks.gradle-stop]
description = "Stop Gradle daemons (use when builds hang or files stay locked)"
run = "./gradlew --stop"
run_windows = ".\\gradlew.bat --stop"

[tasks.wrapper-upgrade]
description = "Upgrade the Gradle wrapper. Get the version and sha256 from https://gradle.org/releases/"
usage = '''
arg "<version>" help="Gradle version, e.g. 9.5.0"
arg "<sha256>" help="Distribution binary-only zip checksum"
'''
run = "./gradlew wrapper --gradle-version ${usage_version} --gradle-distribution-sha256-sum=${usage_sha256}"
run_windows = ".\\gradlew.bat wrapper --gradle-version %usage_version% --gradle-distribution-sha256-sum=%usage_sha256%"
